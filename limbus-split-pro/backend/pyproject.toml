[project]
name = "limbus-split-pro-backend"
version = "0.1.0"
description = "Backend local de separación de stems con IA (Demucs + BSRNN). Privado: escucha solo en 127.0.0.1."
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Runtime de inferencia. En el equipo objetivo instalar la build CUDA adecuada:
    # pip install torch --index-url https://download.pytorch.org/whl/cu124  (o cpu)
    "torch>=2.3",
    "torchaudio>=2.3",
    "demucs>=4.0.1",
    "soundfile>=0.12.1",
    "numpy>=1.26,<2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
